name: Daily Auto Commit

on:
  schedule:
    # Runs at 11:00 UTC daily
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual triggering from GitHub UI / API

concurrency:
  group: daily-auto-commit
  cancel-in-progress: false

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Random delay (scheduled runs only)
        if: github.event_name == 'schedule'
        run: |
          # Random delay between 0 and 600 seconds (0-10 minutes)
          DELAY=$((RANDOM % 600))
          echo "Sleeping for $DELAY seconds to randomize daily commit timestamp..."
          sleep $DELAY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate activity entry
        run: |
          python scripts/daily_keepalive.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity.txt

          if git diff --staged --quiet; then
            echo "No changes detected in activity.txt. Skipping commit."
            echo "STATUS=skipped" >> $GITHUB_ENV
            exit 0
          fi

          MESSAGES=(
            "chore: daily automated maintenance"
            "chore: repository health check"
            "chore: scheduled metadata refresh"
            "chore: automated keepalive update"
            "chore: routine repository sync"
            "chore: periodic activity log"
            "chore: daily workflow update"
            "chore: automated housekeeping"
            "chore: scheduled system check"
            "chore: routine maintenance update"
            "chore: continuous integration pulse check"
            "chore: periodic state synchronization"
          )
          RANDOM_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git commit -m "$RANDOM_MSG"

          # Resilient push with retry loop & rebase
          MAX_RETRIES=3
          RETRY_COUNT=0
          PUSH_SUCCESS=false

          until [ $RETRY_COUNT -ge $MAX_RETRIES ]; do
            echo "Attempting git push (Attempt $((RETRY_COUNT+1))/$MAX_RETRIES)..."
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push origin main; then
              PUSH_SUCCESS=true
              break
            fi
            RETRY_COUNT=$((RETRY_COUNT+1))
            echo "Push failed. Retrying in 5 seconds..."
            sleep 5
          done

          if [ "$PUSH_SUCCESS" = false ]; then
            echo "Failed to push after $MAX_RETRIES attempts."
            exit 1
          fi

          # Post-push strict remote verification
          echo "Verifying push on remote origin/main..."
          git fetch origin main
          LOCAL_HASH=$(git rev-parse HEAD)
          REMOTE_HASH=$(git rev-parse origin/main)

          if [ "$LOCAL_HASH" != "$REMOTE_HASH" ]; then
            echo "Post-push verification failed! Local commit ($LOCAL_HASH) != Remote HEAD ($REMOTE_HASH)"
            exit 1
          fi

          echo "Post-push verification passed: Local HEAD matches Remote origin/main ($LOCAL_HASH)."
          echo "COMMIT_HASH=$LOCAL_HASH" >> $GITHUB_ENV
          echo "COMMIT_MSG=$RANDOM_MSG" >> $GITHUB_ENV
          echo "STATUS=success" >> $GITHUB_ENV

      - name: Create Job Summary
        if: always()
        run: |
          echo "### Daily Auto Commit Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Event**: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: \`${{ env.STATUS || 'unknown' }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ env.STATUS }}" = "success" ]; then
            echo "- **Commit Hash**: \`${{ env.COMMIT_HASH }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Commit Message**: \`${{ env.COMMIT_MSG }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Remote Verification**: Passed (Local HEAD matches Remote `origin/main`)" >> $GITHUB_STEP_SUMMARY
          fi
