name: Daily Auto Commit

on:
  schedule:
    # Runs at 11:00 UTC (16:00 PKT) daily
    - cron: '0 11 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Random delay
        run: |
          # Sleep for a random amount of time between 0 and 60 minutes
          # This ensures the commit doesn't happen at the exact same minute every day
          DELAY=$((RANDOM % 3600))
          echo "Sleeping for $DELAY seconds to randomize commit time..."
          sleep 5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate activity entry
        run: |
          python -c "
          import random
          from datetime import datetime
          
          messages = [
              'Daily maintenance',
              'Repository health check',
              'Metadata refresh',
              'Automated update',
              'Keepalive entry',
              'Routine housekeeping',
              'Scheduled synchronization',
              'Periodic status update',
              'System heartbeat',
              'Automated maintenance run',
              'Repository sync complete',
              'Daily activity log',
              'Workflow continuity check',
              'Routine integrity verification',
              'Scheduled upkeep'
          ]
          
          msg = random.choice(messages)
          timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S')
          entry = f'[{timestamp}] {msg}\n'
          
          with open('activity.txt', 'a', encoding='utf-8') as f:
              f.write(entry)
          
          print(f'Added to activity.txt: {entry.strip()}')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add activity.txt
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          
          MESSAGES=(
            "chore: daily automated maintenance"
            "chore: repository health check"
            "chore: scheduled metadata refresh"
            "chore: automated keepalive update"
            "chore: routine repository sync"
            "chore: periodic activity log"
            "chore: daily workflow update"
            "chore: automated housekeeping"
            "chore: scheduled system check"
            "chore: routine maintenance update"
          )
          RANDOM_MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}
          
          git commit -m "$RANDOM_MSG"
          git push
